<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<h1>Painel do Admin</h1>

<div class="form-box">

  <input type="text" id="nome" placeholder="Nome Completo">
  <input type="text" id="cpf" placeholder="CPF 000.000.000-00">
  <input type="text" id="rg" placeholder="RG">
  <input type="text" id="socio" placeholder="Número Sócio">
  <input type="password" id="senha" placeholder="Senha 4 números" maxlength="4">

  <label>Foto:</label>
  <input type="file" id="foto" accept="image/*">

  <label>Escolha:</label>
  <select id="tipo">
    <option value="cliente">Login</option>
    <option value="admin">Admin</option>
  </select>

  <button onclick="registrar()">Registrar</button>

</div>

<h2>Lista de Cadastrados</h2>
<div id="lista"></div>

<script src="admin.js"></script>
<script>
  if (!localStorage.getItem("adminLogado")) {
    alert("Acesso restrito ao administrador!");
    window.location.href = "admin.html";
  }
</script>
</body>
</html>
